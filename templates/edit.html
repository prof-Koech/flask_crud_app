{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto mt-8 bg-white shadow-md rounded-xl p-8">
  <h2 class="text-xl font-bold text-gray-800 mb-6">✏️ Edit User</h2>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
      <input name="name" type="text" required value="{{ user.name }}"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input name="email" type="email" required value="{{ user.email }}"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
      <select name="role"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="user"  {% if user.role == 'user'  %}selected{% endif %}>User</option>
        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
      </select>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
        class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg text-sm font-medium">
        Update User
      </button>
      <a href="/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
