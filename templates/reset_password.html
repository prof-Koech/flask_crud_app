{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-10">
  <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-indigo-700 mb-6 text-center">🔒 Reset Password</h2>
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
        <input name="password" type="password" required placeholder="Min 6 characters"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
        <input name="confirm_password" type="password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold text-sm">
        Reset Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
