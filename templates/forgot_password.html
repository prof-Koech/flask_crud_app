{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-10">
  <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-indigo-700 mb-2 text-center">🔑 Forgot Password</h2>
    <p class="text-sm text-gray-500 text-center mb-6">Enter your email to receive a reset link.</p>
    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input name="email" type="email" required placeholder="you@example.com"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold text-sm">
        Send Reset Link
      </button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
      <a href="/login" class="text-indigo-600 hover:underline">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
