{% extends 'base.html' %}
{% block content %}
<div class="max-w-lg mx-auto mt-8 bg-white shadow-md rounded-xl p-8">
  <h2 class="text-xl font-bold text-gray-800 mb-6">➕ Add New User</h2>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
      <input name="name" type="text" required placeholder="John Doe"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input name="email" type="email" required placeholder="john@example.com"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
      <select name="role"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-medium">
        Save User
      </button>
      <a href="/" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-2 rounded-lg text-sm font-medium">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
